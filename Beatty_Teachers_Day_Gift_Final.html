
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beatty Teachers' Day Gift</title>
<style>
body{margin:0;font-family:Arial;background:#F5EBDD;display:flex;justify-content:center;padding:20px}
.card{max-width:420px;background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.gift{width:120px;height:120px;margin:12px auto;border-radius:22px;background:linear-gradient(135deg,#8C1D40,#D4AF37);cursor:pointer}
.meta{text-align:center;color:#8B6A00;font-size:12px;font-weight:bold}.school{text-align:center;color:#8C1D40}
#result{display:none}.emoji{text-align:center;font-size:52px}.title{text-align:center;font-size:28px;color:#8C1D40;font-weight:bold}.body{text-align:center;color:#555;line-height:1.6}
.vote{display:flex;justify-content:center;gap:12px;margin:18px 0}.vote button{font-size:26px;padding:10px 18px;border-radius:12px;border:1px solid #ddd;background:#fff;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{background:#FAF7F2;border-radius:14px;padding:12px;text-align:center}.num{font-size:22px;font-weight:bold;color:#8C1D40}.lbl{font-size:11px;color:#777}.thanks{text-align:center;color:#2F855A;font-weight:bold;display:none}
</style></head><body><div class="card">
<div id="giftView"><div class="meta">HAPPY TEACHERS' DAY</div><h2 class="school">Beatty Secondary School</h2><div class="gift" onclick="unwrap()"></div><p style="text-align:center">Tap to unwrap your little surprise 🎁</p></div>
<div id="result"><div class="emoji" id="emo"></div><div class="title" id="ttl"></div><p class="body" id="txt"></p>
<div class="vote"><button onclick="vote('up')">👍</button><button onclick="vote('down')">👎</button></div><div class="thanks" id="thanks">Thank you for your feedback! 💛</div>
<div class="stats"><div class="stat"><div class="num" id="scans">—</div><div class="lbl">Gifts Unwrapped</div></div><div class="stat"><div class="num" id="devices">—</div><div class="lbl">Unique Devices</div></div></div></div></div>
<script>
const APPS_SCRIPT_URL="PASTE_YOUR_WEBAPP_URL";
const GIFTS=[["🌱","Every lesson plants a seed.","Thank you for helping young minds grow."],["☕","Staff Room Prophecy","The moment you finally sit down with kopi… someone says, 'Cher, got one minute?'"],["🍀","Jiayou, lah!","May your kopi stay hot and your Wi-Fi never disconnect."],["🐝","Beatty Teacher Bingo","How many of these happened this week?"]];
let deviceId=localStorage.getItem("beatty_device");if(!deviceId){deviceId=crypto.randomUUID();localStorage.setItem("beatty_device",deviceId);}
async function api(action,vote=""){if(APPS_SCRIPT_URL.includes("PASTE"))return;const r=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,deviceId,vote})});const d=await r.json();scans.textContent=d.totalScans;devices.textContent=d.uniqueDevices;}
async function unwrap(){giftView.style.display="none";result.style.display="block";const g=GIFTS[Math.floor(Math.random()*GIFTS.length)];emo.textContent=g[0];ttl.textContent=g[1];txt.textContent=g[2];await api("scan");}
async function vote(v){document.querySelector(".vote").style.display="none";thanks.style.display="block";await api("feedback",v);}
</script></body></html>
