<!DOCTYPE html><html><head><meta charset="utf-8"><title>Gallery</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<style>
body{font-family:Arial}
h2{margin:16px 0 8px}
#filter{margin:10px 0;padding:5px;height:120px}
h3{margin:20px 0 8px;color:#555;border-top:1px solid #ddd;padding-top:16px}
.card{border:1px solid #ccc;padding:10px;margin:10px;display:inline-block;width:220px;vertical-align:top}
.printed-card{border-color:#ddd;opacity:0.6}
img{width:200px}
#err{color:red;margin:8px}
</style></head>
<body>
<h2>Print Queue</h2>
<p style="font-size:12px; color:#666;">Hold <b>Ctrl</b> (or <b>Cmd</b>) to select multiple colours.</p>
<select id="filter" multiple>
  <option value="RED" selected>🔴 Red</option>
  <option value="BLU" selected>🔵 Blue</option>
  <option value="YLW" selected>🟡 Yellow</option>
  <option value="GRN" selected>🟢 Green</option>
  <option value="WHT" selected>⚪ White</option>
</select>
<p id="err"></p>
<div id="queue"></div>
<h3>Already Printed</h3>
<div id="printed"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwIa6Ls2xX6yusULhg-GptZp5fjCuVkuOL6INEA_SlazGlccqYxingpWPQEWJvHoP3x/exec";

function fileId(url){const m=url.match(/[?&]id=([^&]+)/);return m?m[1]:null;}
function thumbUrl(url){const id=fileId(url);return id?"https://drive.google.com/thumbnail?id="+id+"&sz=w800":url;}
function dlUrl(url){const id=fileId(url);return id?"https://drive.google.com/uc?export=download&id="+id:url;}

function makeCard(p,isPrinted){
  const div=document.createElement('div');
  div.className='card'+(isPrinted?' printed-card':'');
  div.innerHTML=`<img src="${thumbUrl(p.url)}"><br>${p.name}<br>
  <a href="${dlUrl(p.url)}" target="_blank">Download</a><br>
  <button>${isPrinted ? 'Undo' : 'Mark Printed'}</button>`;
  
  const btn = div.querySelector('button');
  btn.onclick = async () => {
    btn.disabled = true;
    const actionName = isPrinted ? 'unprinted' : 'printed';
    await fetch(API_URL,{
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type":"text/plain"},
      body: JSON.stringify({action: actionName, id: p.id})
    });
    setTimeout(load, 1500);
  };
  
  return div;
}

async function load(){
  try{
    const d=await fetch(API_URL+"?action=list&t="+Date.now()).then(r=>r.json());
    const queue=document.getElementById('queue');
    const printed=document.getElementById('printed');
    
    // Get array of selected values
    const selectedOptions = Array.from(document.getElementById('filter').selectedOptions).map(o => o.value);
    
    queue.innerHTML="";
    printed.innerHTML="";
    
    d.forEach(p=>{
      // Filter logic: Check if the photo's name starts with any of the selected values
      const isMatch = selectedOptions.some(colour => p.name.startsWith(colour));
      if(!isMatch) return;
      
      if(p.printed) printed.appendChild(makeCard(p,true));
      else queue.appendChild(makeCard(p,false));
    });
    
    if(!queue.children.length && !printed.children.length) 
        queue.innerHTML="<p style='color:#999'>No photos found matching selection.</p>";
  }catch(e){
    document.getElementById('err').textContent="Error loading gallery: "+e.message;
  }
}

document.getElementById('filter').onchange = load;
load();
setInterval(load,5000);
</script></body></html>
