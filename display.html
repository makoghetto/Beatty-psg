<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Golden Fiesta — Live Display</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font-family:Arial,sans-serif;height:100vh;overflow:hidden}

#header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#1a1a1a;border-bottom:1px solid #333;}
#header h1{font-size:20px;letter-spacing:1px}

#grid{display:grid;gap:20px;padding:20px;height:calc(100vh - 53px);align-content:start;overflow-y:auto;}
.g2{grid-template-columns:repeat(auto-fit, minmax(400px, 1fr))}
.g6{grid-template-columns:repeat(auto-fit, minmax(300px, 1fr))}

.card{
  background:#111;border-radius:10px;overflow:hidden;
  position:relative; /* Required for absolute QR positioning */
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
.card .photo{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;border-radius:8px}

/* Overlaying QR Code */
.card .qr{
  position:absolute;bottom:15px;left:15px;
  background:#fff;padding:4px;border-radius:6px;
  border:2px solid #000;z-index:10;
}

#overlay{display:none;position:fixed;inset:0;background:#0d0d0d;z-index:200;flex-direction:column}
#overlay.on{display:flex}
#overlayHeader{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#1a1a1a;border-bottom:1px solid #333}
#expandGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;padding:20px;overflow-y:auto}
</style>
</head><body>

<div id="header">
  <h1>✨ Golden Fiesta 2026</h1>
  <button id="expandBtn" onclick="renderExpand();overlay.classList.add('on')">⤢ View Last 12</button>
</div>

<div id="grid" class="g6"></div>

<div id="overlay">
  <div id="overlayHeader"><span>Last 12 Photos</span><button id="closeBtn" onclick="overlay.classList.remove('on')">✕ Close</button></div>
  <div id="expandGrid"></div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxAz4XZfvW3DB6auoGAbVtQawNHKR-XJ4Pue3AOarhmTrPiVxHxV-E34-tW2L3XKrs/exec";

function fid(url){const m=url.match(/[?&]id=([^&]+)/);return m?m[1]:null;}
function thumb(url,w){const id=fid(url);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`:url;}
function dl(url){const id=fid(url);return id?`https://drive.google.com/uc?export=download&id=${id}`:url;}
function qrSrc(url,px){return `https://api.qrserver.com/v1/create-qr-code/?size=${px}x${px}&margin=0&data=${encodeURIComponent(dl(url))}`;}

function makeCard(p,thumbW,qrPx){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`
    <img class="photo" src="${thumb(p.url,thumbW)}" alt="">
    <img class="qr" src="${qrSrc(p.url,qrPx)}" width="${qrPx}" height="${qrPx}" alt="QR">`;
  return d;
}

const grid=document.getElementById('grid');
const expGrid=document.getElementById('expandGrid');
const overlay=document.getElementById('overlay');
let data=[];

function renderMain(){
  const n=parseInt(document.getElementById('countSel')?.value || 6);
  grid.className=n===2?'g2':'g6';
  grid.innerHTML='';
  data.slice(-n).reverse().forEach(p=>grid.appendChild(makeCard(p,800,120)));
}

function renderExpand(){
  expGrid.innerHTML='';
  data.slice(-12).reverse().forEach(p=>expGrid.appendChild(makeCard(p,600,100)));
}

async function load(){
  try{
    data=await fetch(API_URL+'?action=list&t='+Date.now()).then(r=>r.json());
    renderMain();
    if(overlay.classList.contains('on')) renderExpand();
  }catch(e){}
}

load();
setInterval(load, 5000);
</script>
</body></html>
