<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Beatty Teachers' Day</title><style>
:root{--beatty:#8C1D40;--gold:#D4AF37;--text:#3A2E2E}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle,#fffdf8,#f3e5d6);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(430px,100%);background:rgba(255,255,255,.9);border:1px solid rgba(212,175,55,.35);border-radius:28px;padding:30px 24px;box-shadow:0 18px 45px rgba(90,40,40,.18);text-align:center;position:relative;overflow:hidden}.badge{display:inline-block;background:#F9EEC7;color:#8B6A00;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.08em}.school{color:var(--beatty);font-weight:700;margin-top:10px;font-size:15px}.category{margin-top:16px;font-size:11px;letter-spacing:.18em;color:#9B8A78;font-weight:700}.emoji{font-size:62px;margin:18px 0 6px}.greeting{font-size:38px;line-height:1.08;font-weight:800;color:#5C1430;margin:6px 0 14px}.divider{width:72px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto}.sub{font-size:17px;line-height:1.6;color:#5C534E}.bingo{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#FBF7F0;border:1px solid #F1E5D0;border-radius:12px;padding:10px 8px;font-size:12px;line-height:1.35}.footer{margin-top:22px;padding-top:18px;border-top:1px solid #F0E6D6;font-size:12px;color:#9B8A78}.confetti{position:fixed;width:8px;height:14px;top:-20px;animation:fall 3.4s linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(720deg);opacity:0}}</style></head><body><div class='card'><div class='badge' id='header'></div><div class='school' id='school'></div><div class='category' id='category'></div><div class='emoji' id='emoji'></div><div class='greeting' id='message'></div><div class='divider'></div><div class='sub' id='sub'></div><div id='bingo' class='bingo' style='display:none'></div><div class='footer'>With appreciation from the Beatty PSG 💛</div></div><script>
const SCHOOL_NAME="Beatty Secondary School";const HEADER_TEXT="HAPPY TEACHERS' DAY";
const QUOTES=[["🌱","Every lesson plants a seed.","Thank you for helping young minds grow into confident, curious individuals."],["✨","You matter more than you realise.","The encouragement you give today may stay with a student for life."],["📚","Progress, not perfection.","The little moments you create often become the biggest memories."],["🦋","Your patience becomes someone else's confidence.","Thank you for believing in every learner."],["☀️","Keep inspiring.","Your classroom is a place where futures quietly begin."],["💛","A kind teacher is never forgotten.","Happy Teachers' Day from all of us at Beatty."]];
const WISHES=[["🍀","Jiayou, lah!","May your kopi stay hot, your Wi-Fi stay strong, and your day be filled with appreciation."],["💰","Huat ah!","Wishing you smooth lessons, kind students, and plenty of laughter this week."],["🧋","Perfect pearl ratio!","May every bubble tea you drink be absolutely shiok."],["🌤️","Today's forecast: 100% appreciation.","No sudden announcements, no printer jams!"],["☕","Chope some happiness.","You've earned the best seat in the staff room today."]];
const BINGO=["Someone said “Cher, can go toilet?”","You heard “I forgot my homework.”","A student made you laugh unexpectedly.","Someone thanked you sincerely.","You confiscated (or almost confiscated) a phone.","You said “Settle down, please.”","A colleague rescued your printer.","You finished your kopi before it turned cold."];
const category=document.getElementById('category'),emoji=document.getElementById('emoji'),message=document.getElementById('message'),sub=document.getElementById('sub'),bingo=document.getElementById('bingo');document.getElementById('header').textContent=HEADER_TEXT;document.getElementById('school').textContent=SCHOOL_NAME;
function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function confetti(){let c=['#D4AF37','#8C1D40','#F4C542','#C94F7C','#7BBF6A'];for(let i=0;i<28;i++){let d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[Math.floor(Math.random()*c.length)];document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}}function show(){confetti();let r=Math.random();bingo.style.display='none';bingo.innerHTML='';if(r<.4){let q=pick(QUOTES);category.textContent='A LITTLE INSPIRATION';emoji.textContent=q[0];message.textContent=q[1];sub.textContent=q[2]}else if(r<.8){let w=pick(WISHES);category.textContent='SINGAPORE GOOD LUCK WISH';emoji.textContent=w[0];message.textContent=w[1];sub.textContent=w[2]}else{category.textContent='BEATTY TEACHER BINGO · THIS WEEK';emoji.textContent='🐝';message.textContent='How many have happened this week?';sub.textContent='Count your score — 6 or more means you survived a classic Beatty week!';bingo.style.display='grid';shuffle(BINGO).forEach(t=>{let div=document.createElement('div');div.className='tile';div.textContent=t;bingo.appendChild(div)})}}show();
</script></body></html>
