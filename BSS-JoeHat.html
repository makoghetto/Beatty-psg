<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beatty Teachers' Day Gift</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👩‍🏫%3C/text%3E%3C/svg%3E">

<style>
:root{--m:#8C1D40;--g:#D4AF37;--c:#FBF8F2}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:radial-gradient(circle at top,#FFFDF9,#F3E7D8 70%,#EAD7C4);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:430px;background:#fff;border-radius:28px;box-shadow:0 18px 45px rgba(0,0,0,.12);overflow:hidden}
.header{text-align:center;padding:24px}
.badge{display:inline-block;background:#F8EDC8;color:#8B6A00;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:bold;letter-spacing:.08em}
.school{margin-top:10px;color:var(--m);font-weight:bold}
.section{padding:0 24px 28px;text-align:center}
.gift{
  width:130px;
  height:130px;
  margin:18px auto;
  border-radius:22px;
  background:linear-gradient(135deg,#8C1D40,#C73E5B);
  position:relative;
  cursor:pointer;
  overflow:hidden;
  box-shadow:0 12px 24px rgba(140,29,64,.35);
  transition:.2s;
}

.gift:hover{
  transform:scale(1.04);
}

.gift:before,
.gift:after{
  content:"";
  position:absolute;
  background:var(--g);
  pointer-events:none;   /* ← CRITICAL */
}

.gift:before{
  left:calc(50% - 9px);
  width:18px;
  height:100%;
}

.gift:after{
  top:calc(50% - 9px);
  width:100%;
  height:18px;
}.category{font-size:11px;color:#8A7B70;letter-spacing:.18em;font-weight:bold}
.emoji{font-size:56px;margin-top:8px}
.title{font-size:30px;font-weight:800;color:var(--m);line-height:1.1;margin:8px 0}
.body{font-size:16px;line-height:1.6;color:#5C534D}
.divider{width:70px;height:3px;margin:16px auto;background:linear-gradient(90deg,transparent,var(--g),transparent)}
.hidden{display:none}
.vote{display:flex;justify-content:center;gap:14px;margin-top:20px}
.vote button{font-size:26px;padding:10px 16px;border-radius:14px;border:1px solid #DDD;background:#fff;cursor:pointer}
.thanks{display:none;color:#2F855A;font-weight:bold;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.stat{background:var(--c);padding:12px;border-radius:14px}
.num{font-size:22px;font-weight:bold;color:var(--m)}
.lbl{font-size:11px;color:#888;text-transform:uppercase}
.footer{padding:18px;border-top:1px solid #EEE;text-align:center;font-size:12px;color:#888}
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tile{background:var(--c);border:1px solid #E8DDCA;border-radius:12px;padding:8px;font-size:11px;min-height:86px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;text-align:center}
.tile.checked{background:#E8F6EC;border-color:#4CAF50}
.win{margin-top:12px;color:#C62828;font-weight:bold}
.coupon{margin-top:18px;background:#FFF8E8;border:2px dashed var(--g);border-radius:16px;padding:16px}
.stamp{display:inline-block;margin-top:12px;padding:6px 10px;border:2px solid #C62828;color:#C62828;font-size:11px;font-weight:bold;border-radius:999px;transform:rotate(-8deg)}
.rps{display:flex;justify-content:center;gap:12px;margin-top:16px}
.rps button{font-size:28px;padding:10px 14px;border-radius:12px;border:1px solid #DDD;background:#fff;cursor:pointer}
.result{margin-top:12px;font-weight:bold;line-height:1.6}
.knot{
  position:absolute;
  width:22px;
  height:22px;
  background:#F5D76E;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:3;
  pointer-events:none;
}

.bow{
  position:absolute;
  width:34px;
  height:24px;
  border:8px solid #F5D76E;
  border-radius:50%;
  top:18px;
  z-index:2;
  pointer-events:none;
}

.bow-left{
  left:20px;
  transform:rotate(-28deg);
}

.bow-right{
  right:20px;
  transform:rotate(28deg);
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;              /* IMPORTANT */
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:86%;
  max-width:320px;
  background:white;
  border-radius:20px;
  padding:22px;
  text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}

.modal-card h3{
  margin:8px 0 6px;
  color:#8C1D40;
}

.modal-card p{
  color:#666;
  line-height:1.5;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-buttons button{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#8C1D40;
  color:white;
}

.secondary{
  background:#F3F3F3;
  color:#555;
}  
.confetti{position:fixed;width:8px;height:14px;top:-20px;pointer-events:none;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div class="card">

  <div class="header">
    <div class="badge">HAPPY TEACHERS' DAY</div>
    <div class="school">Beatty Secondary School</div>
  </div>

  <div id="giftView" class="section">
    <div class="gift" onclick="unwrap()">
  <div class="knot"></div>
  <div class="bow bow-left"></div>
  <div class="bow bow-right"></div>
</div>
    <h2 style="color:#5C1430;margin:0">A Little Gift For You</h2>
    <p>Every Beatty teacher deserves a little surprise. Tap to unwrap yours.</p>
  </div>

  <div id="resultView" class="section hidden">
    <div class="category" id="cat"></div>
    <div class="emoji" id="emo"></div>
    <div class="title" id="ttl"></div>
    <div class="divider"></div>
    <div class="body" id="txt"></div>
    <div id="extra"></div>

    <div class="vote" id="voteRow">
      <button onclick="vote('up')">👍</button>
      <button onclick="vote('down')">👎</button>
    </div>
    <div class="thanks" id="thanks">💛 Thank you for your feedback!</div>

    <div class="stats">
      <div class="stat"><div class="num" id="scans">–</div><div class="lbl">Gifts</div></div>
      <div class="stat"><div class="num" id="devices">–</div><div class="lbl">Devices</div></div>
    </div>
  </div>

  <div class="footer">With appreciation from the Beatty PSG 💛</div>
</div>

  <div id="againModal" class="modal">
  <div class="modal-card">
    <div style="font-size:42px;">🎁</div>
    <h3>Another gift?</h3>
    <p>Fancy unwrapping one more little surprise?</p>

    <div class="modal-buttons">
      <button class="secondary" onclick="closeModal()">Maybe Later</button>
      <button class="primary" onclick="location.reload()">Another Gift</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby49XCFF5hBd1YTYZpxDbTxNtxiNEtJsYBLL4PIlHNkU2ErdY4FVxFEm7vf8VEDOfiFMw/exec";


const QUOTES=[
["🌱","Every lesson plants a seed.","Thank you for helping young minds grow."],
["✨","You matter more than you realise.","Your encouragement lasts longer than you think."],
["🦋","Your patience becomes someone else's confidence.","Keep inspiring, Cher!"]
];

const WISHES=[
["🍀","Jiayou, lah!","May your kopi stay hot and your Wi-Fi never disconnect."],
["🧋","Shiok week ahead!","May every bubble tea have the perfect pearl ratio."],
["💰","Huat ah!","May your marking pile shrink faster than the chicken rice queue."]
];

const HUMOUR=[
["☕","Staff Room Prophecy","The moment you finally sit down with kopi… someone will say, 'Cher, got one minute?'"],
["📄","Singapore Teacher Logic","The printer only jams when you're printing 38 worksheets."],
["😅","Classic Beatty Energy","You opened Google Classroom… and forgot why."]
];

const COUPONS=[
["☕","1× Kopi Break Voucher","Redeem for one guilt-free kopi break."],
["😴","30-Minute Nap Pass","Valid only in your imagination. HR never approve."],
["📄","Printer Jam Immunity","Next print job guaranteed smooth."],
["🧋","Bubble Tea Protection Plan","Calories today officially don't count."],
["📚","Homework Extension Card","For teachers only. Mark tomorrow instead."],
["🚫","'Cher, Can Go Toilet?' Shield","Blocks the next three toilet requests."],
["🎉","Friday Feeling Fast Pass","Makes today feel like Friday."],
["🚌","MRT Seat Reservation","One guaranteed seat after school. Maybe."]
];

const STAMPS=[
"STEADY POM PI PI",
"DON'T SAY I BOJIO",
"I NEVER BLUFF YOU",
"ONZ LAH",
"CONFIRM PLUS CHOP",
"CONFIRM GUARANTEE CHOP"
];

const BINGO=[
"Cher, can go toilet?","I forgot my homework.","Settle down, please.",
"Student made you laugh.","Unexpected timetable change.","Colleague rescued your printer.",
"Finished kopi while hot.","Parent messaged after 9pm.","Projector worked first try!",
"Can extend deadline?","You survived a fire drill.","Student said 'Thank you, Cher.'"
];

const FORTUNES=[
"Someone will make you smile before the day ends.",
"Coffee will taste extra good tomorrow.",
"Kindness you gave will come back to you."
];

let device=localStorage.getItem("beatty_device");
if(!device){device=crypto.randomUUID();localStorage.setItem("beatty_device",device);}

const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function shuffle(a){
 a=[...a];
 for(let i=a.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

 
async function api(action,v=""){
 if(APPS_SCRIPT_URL.startsWith("YOUR_")) return;
 const r=await fetch(APPS_SCRIPT_URL,{
   method:"POST",
   headers:{"Content-Type":"text/plain"},
   body:JSON.stringify({deviceId:device,action,vote:v})
 });
 const d=await r.json();
 $("scans").textContent=d.totalScans;
 $("devices").textContent=d.uniqueDevices;
}

function setView(cat,e,t,b){
 $("cat").textContent=cat.toUpperCase();
 $("emo").textContent=e;
 $("ttl").textContent=t;
 $("txt").textContent=b;
 $("extra").innerHTML="";
 $("voteRow").style.display="flex";
 $("thanks").style.display="none";
}

async function unwrap(){
 $("giftView").classList.add("hidden");
 $("resultView").classList.remove("hidden");

 const r=Math.random();
 if(r<0.20) quote();
 else if(r<0.36) wish();
 else if(r<0.52) humour();
 else if(r<0.70) coupon();
 else if(r<0.85) bingo();
 else game();

 await api("scan");
startAnotherGiftTimer();
}

function quote(){const q=pick(QUOTES);setView("Inspirational",...q);}
function wish(){const w=pick(WISHES);setView("Good Luck Wish",...w);}
function humour(){const h=pick(HUMOUR);setView("Singapore Humour",...h);}

function coupon(){
 const c=pick(COUPONS);
 setView("Singlish Coupon",c[0],c[1],"");
$("extra").innerHTML=`
  <div class="coupon">
    <div style="font-size:10px;font-weight:bold;color:#8B6A00">
      OFFICIAL SINGLISH QUALITY SEAL
    </div>
    <div style="margin-top:8px">${c[2]}</div>
    <div class="stamp">${pick(STAMPS)}</div>
  </div>`;
}

function confetti(){
 const colors=["#D4AF37","#8C1D40","#22C55E","#EC4899","#3B82F6"];
 for(let i=0;i<60;i++){
   const d=document.createElement("div");
   d.className="confetti";
   d.style.left=Math.random()*100+"vw";
   d.style.background=pick(colors);
   document.body.appendChild(d);
   setTimeout(()=>d.remove(),2800);
 }
}

function checkBingo(){
 const t=[...document.querySelectorAll(".tile")].map(x=>x.classList.contains("checked"));
 const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 if(window.bingoDone) return;
 if(w.some(l=>l.every(i=>t[i]))){
   window.bingoDone=true;
   clearTimeout(againTimer);
closeModal();
confetti();
   const m=document.createElement("div");
   m.className="win";
   m.textContent="🎉 BINGO! Confirm plus chop!";
   $("extra").appendChild(m);
 }
}

function bingo(){
 window.bingoDone=false;
 setView("This Week","🐝","Beatty Teacher Bingo","How many of these happened this week?");
 const g=document.createElement("div");
 g.className="bingo";
 shuffle(BINGO).slice(0,9).forEach(i=>{
   const t=document.createElement("div");
   t.className="tile";
   t.innerHTML="⬜<br>"+i;
   t.onclick=()=>{
     t.classList.toggle("checked");
     t.innerHTML=(t.classList.contains("checked")?"✅":"⬜")+"<br>"+i;
     checkBingo();
   };
   g.appendChild(t);
 });
 $("extra").appendChild(g);
}

function game(){
 setView("Mini Game","✊","Rock • Paper • Scissors","Beat your phone to earn a lucky fortune!");
 const r=document.createElement("div");
 r.className="rps";
 ["✊","✋","✌️"].forEach(c=>{
   const b=document.createElement("button");
   b.textContent=c;
   b.onclick=()=>{
     clearTimeout(againTimer);
     closeModal();
     const p=pick(["✊","✋","✌️"]);
     let m="It's a draw 🤝";
     if((c==="✊"&&p==="✌️")||(c==="✋"&&p==="✊")||(c==="✌️"&&p==="✋")) m="🏆 You win!";
     else if(c!==p) m="😄 Phone wins!";
     out.innerHTML=`You: ${c} &nbsp;&nbsp; Phone: ${p}<br><br>${m}<br><br>🍀 ${pick(FORTUNES)}`;
   };
   r.appendChild(b);
 });
 const out=document.createElement("div");
 out.className="result";
 $("extra").appendChild(r);
 $("extra").appendChild(out);
}

let againTimer = null;

function startAnotherGiftTimer() {
  clearTimeout(againTimer);

  againTimer = setTimeout(() => {
    $("againModal").classList.add("show");
  }, 5000);
}

function closeModal() {
  $("againModal").classList.remove("show");
}
async function vote(v){
 $("voteRow").style.display="none";
 $("thanks").style.display="block";
 await api("feedback",v);
}
</script>
</body>
</html>
