<!DOCTYPE html><html><head><meta charset="utf-8"><title>Gallery</title>
<style>body{font-family:Arial}.card{border:1px solid #ccc;padding:10px;margin:10px;display:inline-block;width:220px}img{width:200px}</style></head>
<body><h2>Print Queue</h2><div id="g"></div>
<script>
const API_URL="PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
async function load(){
 let d=await fetch(API_URL+"?action=list").then(r=>r.json());
 let g=document.getElementById('g');g.innerHTML="";
 d.forEach(p=>{
  let div=document.createElement('div');div.className='card';
  div.innerHTML=`<img src="${p.url}"><br>${p.name}<br>Status:${p.printed?"Printed":"New"}<br>
  <a href="${p.url}" download>Download</a><br>
  <button ${p.printed?"disabled":""}>Mark Printed</button>`;
  div.querySelector('button').onclick=async()=>{
    await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"printed",id:p.id})});
    load();
  };
  g.appendChild(div);
 });
}
load();setInterval(load,5000);
</script></body></html>
