<script src="config.js"></script>
<script>
const FRAME="frame.png";
const W=1800,H=1200;
const v=document.getElementById('video'), c=document.getElementById('canvas');
c.width=W;c.height=H;

const COLOUR_MAP = {'RED': '#FF0000', 'BLU': '#0000FF', 'YLW': '#E6D000', 'GRN': '#008000', 'WHT': '#FFFFFF'};
let selectedPhotoId = null;

let currentNum=parseInt(localStorage.getItem('photoNum')||'1');
function setNum(n){
  if(n>50)n=1; else if(n<1)n=50;
  currentNum=n;
  localStorage.setItem('photoNum',n);
  document.getElementById('numDisplay').textContent=String(n).padStart(2,'0');
}
setNum(currentNum);
document.getElementById('dec').onclick=()=>setNum(currentNum-1);
document.getElementById('inc').onclick=()=>setNum(currentNum+1);

navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>v.srcObject=s).catch(e=>{});

function drawPhoto(ctx, imgSource, isFile){
  ctx.clearRect(0,0,W,H);
  
  const srcW = isFile ? imgSource.width : v.videoWidth;
  const srcH = isFile ? imgSource.height : v.videoHeight;
  const srcRatio = srcW / srcH;
  const dstRatio = W / H;
  let sx, sy, sw, sh;
  
  if (srcRatio > dstRatio) {
    sh = srcH; sw = srcH * dstRatio; sx = (srcW - sw) / 2; sy = 0;
  } else {
    sw = srcW; sh = srcW / dstRatio; sx = 0; sy = (srcH - sh) / 2;
  }
  
  ctx.drawImage(isFile ? imgSource : v, sx, sy, sw, sh, 0, 0, W, H);
  
  const f=new Image();
  f.src=FRAME;
  f.onload=()=>{
    ctx.drawImage(f, 0, 0, W, H);
    if(document.getElementById('burnText').checked){
      const colourKey=document.getElementById('colour').value;
      const num=String(currentNum).padStart(2,'0');
      ctx.fillStyle=COLOUR_MAP[colourKey]||'#FFFFFF';
      ctx.font='bold 64px monospace';
      ctx.fillText(`${colourKey}-${num}`, 40, H-40);
    }
    uploadPhoto(c.toDataURL('image/jpeg', 0.9));
  };
}

document.getElementById('file-input').onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => drawPhoto(c.getContext('2d'), img, true);
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

async function uploadPhoto(imageData){
  const colour=document.getElementById('colour').value;
  const num=String(currentNum).padStart(2,'0');
  
  document.getElementById('status').textContent=`Uploading [${colour}-${num}]...`;
  
  try {
    await fetch(API_URL,{
      method:"POST",
      headers: {"Content-Type": "text/plain"},
      body:JSON.stringify({image:imageData, colour:colour, num:num})
    });
    
    document.getElementById('status').textContent=`Success! [${colour}-${num}]`;
    setNum(currentNum+1);
    setTimeout(loadRecent, 2000);
  } catch(err) {
    document.getElementById('status').textContent=`Upload failed: ${err.message}`;
  }
}

document.getElementById('snap').onclick=()=>drawPhoto(c.getContext('2d'), null, false);
document.getElementById('close-btn').onclick=()=>document.getElementById('modal').style.display='none';

document.getElementById('delete-btn').onclick=async()=>{
  if(!selectedPhotoId) return;
  if(!confirm("Are you sure you want to delete this photo?")) return;
  
  document.getElementById('status').textContent="Deleting photo...";
  document.getElementById('modal').style.display='none';
  
  await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain"},
    body: JSON.stringify({action: "delete", id: selectedPhotoId})
  });
  
  document.getElementById('status').textContent="Photo deleted.";
  setTimeout(loadRecent, 1500);
};

function loadRecent(){
  fetch(API_URL+"?action=list&t="+Date.now()).then(r=>r.json()).then(d=>{
    const el=document.getElementById('recent');
    el.innerHTML="";
    d.slice(-9).reverse().forEach(p=>{
      const img=document.createElement('img');
      img.src=p.url.replace("uc?id=","thumbnail?id=")+"&sz=w400";
      img.onclick=()=>{
        selectedPhotoId = p.id;
        document.getElementById('modal-img').src=p.url.replace("uc?id=","thumbnail?id=")+"&sz=w1200";
        document.getElementById('modal').style.display='block';
      };
      el.appendChild(img);
    });
  }).catch(e=>{});
}
loadRecent();
</script>
