<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Golden Fiesta Camera</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:Arial;text-align:center;margin:12px;background:#111;color:#fff}
h2{margin:0 0 10px}

#cam-container{display:inline-block;max-width:95vw;overflow:hidden}

#topbar{
  display:flex;align-items:center;justify-content:space-between;
  background:#222;padding:8px 10px;border-radius:10px 10px 0 0;gap:6px;
  width:100%
}
#colour{
  font-size:15px;padding:6px 8px;border-radius:6px;border:none;
  font-weight:bold;cursor:pointer;flex:1;min-width:0
}
#counter-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cnt-btn{
  font-size:26px;line-height:1;width:44px;height:44px;border-radius:50%;
  border:none;background:#444;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;margin:0
}
.cnt-btn:active{background:#666}
#numDisplay{
  font-size:40px;font-weight:bold;font-family:monospace;
  background:#000;color:#0f0;padding:4px 8px;border-radius:8px;
  text-align:center;letter-spacing:2px;flex-shrink:0
}

#preview-wrap{position:relative}
video{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
canvas{display:none}

#snap{
  display:block;width:100%;max-width:95vw;margin:10px auto;
  padding:28px 0;font-size:36px;font-weight:bold;letter-spacing:2px;
  background:#c0392b;color:#fff;border:none;border-radius:10px;
  cursor:pointer;touch-action:manipulation
}
#snap:active{background:#e74c3c}

#status{margin:6px 0;font-size:16px;color:#aaa;min-height:22px}

#recent{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  margin-top:10px;max-width:95vw;margin-left:auto;margin-right:auto
}
#recent img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;border:2px solid #444}
</style>
</head><body>
<h2>Golden Fiesta 2026</h2>
<div id="cam-container">
  <div id="topbar">
    <select id="colour">
      <option value="RED">🔴 Red</option>
      <option value="BLU">🔵 Blue</option>
      <option value="YLW">🟡 Yellow</option>
      <option value="GRN">🟢 Green</option>
      <option value="WHT">⚪ White</option>
    </select>
    <div id="counter-wrap">
      <button class="cnt-btn" id="dec">−</button>
      <button class="cnt-btn" id="inc">+</button>
    </div>
    <div id="numDisplay">01</div>
  </div>
  <div style="margin: 10px; color: #fff; font-size: 14px;">
    <input type="checkbox" id="burnText" checked> 
    <label for="burnText">Burn label onto photo</label>
  </div>
  <div id="preview-wrap">
    <video id="video" autoplay playsinline></video>
    <img id="overlay" src="frame.png" alt="">
  </div>
</div>
<button id="snap">TAKE PHOTO</button>
<canvas id="canvas"></canvas>
<p id="status"></p>
<div id="recent"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwCHqPYa_mQLgFmSkRsU6xN2Wdg_7C7In1xpssehdM6g0yQwyFrE97pUaCKjqYGAVrq/exec";
const FRAME="frame.png";
const W=1800,H=1200;
const v=document.getElementById('video');
const c=document.getElementById('canvas');
c.width=W;c.height=H;

const COLOUR_MAP = {
  'RED': '#FF0000', 'BLU': '#0000FF', 'YLW': '#E6D000', 'GRN': '#008000', 'WHT': '#FFFFFF'
};

let currentNum=parseInt(localStorage.getItem('photoNum')||'1');
function setNum(n){
  if (n > 50) n = 1;
  else if (n < 1) n = 50;
  currentNum=n;
  localStorage.setItem('photoNum',n);
  document.getElementById('numDisplay').textContent=String(n).padStart(2,'0');
}
setNum(currentNum);
document.getElementById('dec').onclick=()=>setNum(currentNum-1);
document.getElementById('inc').onclick=()=>setNum(currentNum+1);

navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}})
  .then(s=>v.srcObject=s)
  .catch(err=>{document.getElementById('status').textContent="Camera error: "+err.message;});

function drawPhoto(ctx, frameImg){
  const vw=v.videoWidth,vh=v.videoHeight;
  const vRatio=vw/vh,tRatio=W/H;
  let sx,sy,sw,sh;
  if(vRatio>tRatio){sw=vh*tRatio;sh=vh;sx=(vw-sw)/2;sy=0;}
  else{sw=vw;sh=vw/tRatio;sx=0;sy=(vh-sh)/2;}
  
  ctx.filter="contrast(1.08) saturate(1.06) brightness(1.05)";
  ctx.drawImage(v,sx,sy,sw,sh,0,0,W,H);
  ctx.filter="none";

  if(frameImg) ctx.drawImage(frameImg, 0, 0, W, H);

  if(document.getElementById('burnText').checked) {
    const colourKey = document.getElementById('colour').value;
    const num = String(currentNum).padStart(2, '0');
    ctx.fillStyle = COLOUR_MAP[colourKey] || '#FFFFFF';
    ctx.font = 'bold 64px monospace';
    ctx.fillText(`${colourKey}-${num}`, 40, H - 40);
  }
}

function thumbUrl(url){
  const m=url.match(/[?&]id=([^&]+)/);
  return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w400":url;
}

function loadRecent(){
  fetch(API_URL+"?action=list&t="+Date.now()).then(r=>r.json()).then(d=>{
    const recent=d.slice(-9).reverse();
    const el=document.getElementById('recent');
    el.innerHTML="";
    recent.forEach(p=>{
      const img=document.createElement('img');
      img.src=thumbUrl(p.url);
      img.title=p.name;
      el.appendChild(img);
    });
  }).catch(()=>{});
}

function upload(imageData){
  const colour=document.getElementById('colour').value;
  const num=String(currentNum).padStart(2,'0');
  document.getElementById('status').textContent="Sending...";
  fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
    body:JSON.stringify({image:imageData,colour:colour,num:num})});
  document.getElementById('status').textContent="Sent! ["+colour+"-"+num+"] Check the gallery.";
  setNum(currentNum+1);
  setTimeout(loadRecent,7000);
  setTimeout(loadRecent,14000);
}

document.getElementById('snap').onclick=()=>{
  if(!v.videoWidth){document.getElementById('status').textContent="Camera not ready";return;}
  const ctx=c.getContext('2d');
  const f=new Image();
  f.onload=()=>{drawPhoto(ctx, f);upload(c.toDataURL('image/jpeg',0.92));};
  f.onerror=()=>{drawPhoto(ctx, null);upload(c.toDataURL('image/jpeg',0.92));};
  f.src=FRAME;
};

loadRecent();
setInterval(loadRecent,15000);
</script></body></html>
