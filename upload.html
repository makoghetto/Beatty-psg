<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Golden Fiesta Camera</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:Arial;text-align:center;margin:12px;background:#111;color:#fff}
h2{margin:0 0 10px}
#cam-container{display:inline-block;max-width:95vw;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;background:#222;padding:8px 10px;border-radius:10px 10px 0 0;gap:6px;width:100%}
#colour{font-size:15px;padding:6px 8px;border-radius:6px;border:none;font-weight:bold;cursor:pointer;flex:1;min-width:0}
#counter-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cnt-btn{font-size:26px;line-height:1;width:44px;height:44px;border-radius:50%;border:none;background:#444;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin:0}
#numDisplay{font-size:40px;font-weight:bold;font-family:monospace;background:#000;color:#0f0;padding:4px 8px;border-radius:8px;text-align:center;letter-spacing:2px;flex-shrink:0}
#preview-wrap{position:relative}
video{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
#snap, #upload-btn{display:block;width:100%;max-width:95vw;margin:10px auto;padding:20px 0;font-size:24px;font-weight:bold;border:none;border-radius:10px;cursor:pointer}
#snap{background:#c0392b;color:#fff}
#upload-btn{background:#27ae60;color:#fff}
#file-input{display:none}
#status{margin:6px 0;font-size:16px;color:#aaa;min-height:22px}
#recent{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;max-width:95vw;margin-left:auto;margin-right:auto}
#recent img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;border:2px solid #444;cursor:pointer}

/* Modal Styles */
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;padding:20px}
#modal img{max-width:100%;max-height:80vh;margin:50px auto;display:block}
#close-btn{position:absolute;top:20px;right:20px;font-size:40px;color:#fff;cursor:pointer}
</style>
</head><body>
<h2>Golden Fiesta 2026</h2>
<div id="cam-container">
  <div id="topbar">
    <select id="colour">
      <option value="RED">🔴 Red</option><option value="BLU">🔵 Blue</option><option value="YLW">🟡 Yellow</option><option value="GRN">🟢 Green</option><option value="WHT">⚪ White</option>
    </select>
    <div id="counter-wrap"><button class="cnt-btn" id="dec">−</button><button class="cnt-btn" id="inc">+</button></div>
    <div id="numDisplay">01</div>
  </div>
  <div style="margin: 10px;"><input type="checkbox" id="burnText" checked> <label for="burnText">Burn label</label></div>
  <div id="preview-wrap">
    <video id="video" autoplay playsinline></video>
    <img id="overlay" src="frame.png" alt="">
  </div>
</div>

<button id="snap">TAKE PHOTO</button>
<button id="upload-btn" onclick="document.getElementById('file-input').click()">UPLOAD PHOTO</button>
<input type="file" id="file-input" accept="image/*">
<canvas id="canvas"></canvas>
<p id="status"></p>
<div id="recent"></div>

<div id="modal"><span id="close-btn">&times;</span><img id="modal-img"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycby-KuGReRqvgJnpXzE4m1Vp3w-0mZIjWI1hb-jRdKlH7Z9Sy6SAwvbwSzmKdYTyjVPr/exec";
const FRAME="frame.png";
const W=1800,H=1200;
const v=document.getElementById('video'), c=document.getElementById('canvas');
c.width=W;c.height=H;

// ... (Keep existing COLOUR_MAP, setNum, navigator, drawPhoto, upload, loadRecent logic)

// Thumbnail click handler
function openModal(url){
  document.getElementById('modal-img').src = url;
  document.getElementById('modal').style.display = 'block';
}
document.getElementById('close-btn').onclick = () => document.getElementById('modal').style.display = 'none';

// Update loadRecent to bind clicks
function loadRecent(){
  fetch(API_URL+"?action=list&t="+Date.now()).then(r=>r.json()).then(d=>{
    const el=document.getElementById('recent');
    el.innerHTML="";
    d.slice(-9).reverse().forEach(p=>{
      const img=document.createElement('img');
      const thumb = p.url.replace("uc?id=","thumbnail?id=")+"&sz=w400";
      img.src = thumb;
      img.onclick = () => openModal(p.url.replace("uc?id=","uc?export=view&id="));
      el.appendChild(img);
    });
  });
}
// ... (rest of script initialization)
</script></body></html>
