<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Golden Fiesta Camera</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:Arial;text-align:center;margin:12px;background:#111;color:#fff}
h2{margin:0 0 10px}
#cam-container{display:inline-block;max-width:95vw;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;background:#222;padding:8px 10px;border-radius:10px 10px 0 0;gap:6px;width:100%}
#colour{font-size:15px;padding:6px 8px;border-radius:6px;border:none;font-weight:bold;cursor:pointer;flex:1;min-width:0}
#counter-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cnt-btn{font-size:26px;line-height:1;width:44px;height:44px;border-radius:50%;border:none;background:#444;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin:0}
#numDisplay{font-size:40px;font-weight:bold;font-family:monospace;background:#000;color:#0f0;padding:4px 8px;border-radius:8px;text-align:center;letter-spacing:2px;flex-shrink:0}
#preview-wrap{position:relative}
video{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
#snap, #upload-btn{display:block;width:100%;max-width:95vw;margin:10px auto;padding:20px 0;font-size:24px;font-weight:bold;border:none;border-radius:10px;cursor:pointer}
#snap{background:#c0392b;color:#fff}
#upload-btn{background:#27ae60;color:#fff}
#file-input{display:none}
#status{margin:6px 0;font-size:16px;color:#aaa;min-height:22px}
#recent{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;max-width:95vw;margin-left:auto;margin-right:auto}
#recent img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;border:3px solid #444}
</style>
</head><body>
<h2>Golden Fiesta 2026</h2>
<div id="cam-container">
  <div id="topbar">
    <select id="colour">
      <option value="RED">🔴 Red</option><option value="BLU">🔵 Blue</option><option value="YLW">🟡 Yellow</option><option value="GRN">🟢 Green</option><option value="WHT">⚪ White</option>
    </select>
    <div id="counter-wrap"><button class="cnt-btn" id="dec">−</button><button class="cnt-btn" id="inc">+</button></div>
    <div id="numDisplay">01</div>
  </div>
  <div style="margin: 10px;"><input type="checkbox" id="burnText" checked> <label for="burnText">Burn label</label></div>
  <div id="preview-wrap">
    <video id="video" autoplay playsinline></video>
    <img id="overlay" src="frame.png" alt="">
  </div>
</div>

<button id="snap">TAKE PHOTO</button>
<button id="upload-btn" onclick="document.getElementById('file-input').click()">UPLOAD PHOTO</button>
<input type="file" id="file-input" accept="image/*">
<canvas id="canvas"></canvas>
<p id="status"></p>
<div id="recent"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycby-KuGReRqvgJnpXzE4m1Vp3w-0mZIjWI1hb-jRdKlH7Z9Sy6SAwvbwSzmKdYTyjVPr/exec";
const FRAME="frame.png";
const W=1800,H=1200;
const v=document.getElementById('video'), c=document.getElementById('canvas');
c.width=W;c.height=H;

const COLOUR_MAP = {'RED': '#FF0000', 'BLU': '#0000FF', 'YLW': '#E6D000', 'GRN': '#008000', 'WHT': '#FFFFFF'};

let currentNum=parseInt(localStorage.getItem('photoNum')||'1');
function setNum(n){
  n=Math.max(1,Math.min(50,n));
  currentNum=n;
  localStorage.setItem('photoNum',n);
  document.getElementById('numDisplay').textContent=String(n).padStart(2,'0');
}
setNum(currentNum);
document.getElementById('dec').onclick=()=>setNum(currentNum-1);
document.getElementById('inc').onclick=()=>setNum(currentNum+1);

// Camera Init
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>v.srcObject=s).catch(e=>document.getElementById('status').textContent="Camera error");

function drawPhoto(ctx, imgSource, isFile){
  ctx.clearRect(0,0,W,H);
  if(isFile){
    ctx.drawImage(imgSource, 0, 0, W, H);
  } else {
    ctx.drawImage(v, 0, 0, v.videoWidth, v.videoHeight, 0, 0, W, H);
  }
  const f=new Image();
  f.src=FRAME;
  f.onload=()=>{
    ctx.drawImage(f, 0, 0, W, H);
    if(document.getElementById('burnText').checked) {
      const colourKey = document.getElementById('colour').value;
      const num = String(currentNum).padStart(2, '0');
      ctx.fillStyle = COLOUR_MAP[colourKey];
      ctx.font = 'bold 64px monospace';
      ctx.fillText(`${colourKey}-${num}`, 40, H - 40);
    }
    upload(c.toDataURL('image/jpeg', 0.9));
  };
}

// File Upload Handler
document.getElementById('file-input').onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => drawPhoto(c.getContext('2d'), img, true);
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

function upload(imageData){
  const colour=document.getElementById('colour').value;
  const num=String(currentNum).padStart(2,'0');
  fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({image:imageData,colour:colour,num:num})});
  document.getElementById('status').textContent="Uploaded "+colour+"-"+num;
  setNum(currentNum+1);
  setTimeout(loadRecent, 3000);
}

document.getElementById('snap').onclick=()=>drawPhoto(c.getContext('2d'), null, false);
function loadRecent(){
  fetch(API_URL+"?action=list&t="+Date.now()).then(r=>r.json()).then(d=>{
    const el=document.getElementById('recent');
    el.innerHTML="";
    d.slice(-4).reverse().forEach(p=>{
      const img=document.createElement('img');
      img.src=p.url.replace("uc?id=","thumbnail?id=")+"&sz=w800";
      el.appendChild(img);
    });
  });
}
loadRecent();
</script></body></html>
