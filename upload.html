<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Golden Fiesta Camera</title>
<style>
body{font-family:Arial;text-align:center;margin:20px}
#preview-wrap{display:inline-block;position:relative;max-width:95vw}
video{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
canvas{display:none}
button{padding:12px 18px;margin:8px}
#recent{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;max-width:95vw;margin-left:auto;margin-right:auto}
#recent img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;border:2px solid #ccc}
</style>
</head><body>
<h2>Golden Fiesta 2026</h2>
<div id="preview-wrap">
  <video id="video" autoplay playsinline></video>
  <img id="overlay" src="frame.png" alt="">
</div><br>
<button id="snap">Take Photo</button>
<canvas id="canvas"></canvas>
<p id="status"></p>
<div id="recent"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxdfvRg6oW-99FEMc_54BMC5_ToXldd8D4c9AG4yRzXn34U1UW7Oy0bXag-yNHJv1tD/exec";
const FRAME="frame.png";
const W=1800,H=1200;
const v=document.getElementById('video');
const c=document.getElementById('canvas');
c.width=W;c.height=H;

navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}})
  .then(s=>v.srcObject=s)
  .catch(err=>{document.getElementById('status').textContent="Camera error: "+err.message;});

function drawPhoto(ctx){
  const vw=v.videoWidth,vh=v.videoHeight;
  const vRatio=vw/vh,tRatio=W/H;
  let sx,sy,sw,sh;
  if(vRatio>tRatio){sw=vh*tRatio;sh=vh;sx=(vw-sw)/2;sy=0;}
  else{sw=vw;sh=vw/tRatio;sx=0;sy=(vh-sh)/2;}
  ctx.filter="contrast(1.08) saturate(1.06) brightness(1.05)";
  ctx.drawImage(v,sx,sy,sw,sh,0,0,W,H);
  ctx.filter="none";
}

function thumbUrl(url){
  const m=url.match(/[?&]id=([^&]+)/);
  return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w400":url;
}

function loadRecent(){
  fetch(API_URL+"?action=list&t="+Date.now()).then(r=>r.json()).then(d=>{
    const recent=d.slice(-9).reverse();
    const el=document.getElementById('recent');
    el.innerHTML="";
    recent.forEach(p=>{
      const img=document.createElement('img');
      img.src=thumbUrl(p.url);
      img.title=p.name;
      el.appendChild(img);
    });
  }).catch(()=>{});
}

function upload(imageData){
  document.getElementById('status').textContent="Sending...";
  fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({image:imageData})});
  document.getElementById('status').textContent="Sent! Check the gallery in a moment.";
  setTimeout(loadRecent,7000);
  setTimeout(loadRecent,14000);
}

document.getElementById('snap').onclick=()=>{
  if(!v.videoWidth){document.getElementById('status').textContent="Camera not ready";return;}
  const ctx=c.getContext('2d');
  drawPhoto(ctx);
  const f=new Image();
  f.onload=()=>{ctx.drawImage(f,0,0,W,H);upload(c.toDataURL('image/jpeg',0.92));};
  f.onerror=()=>{upload(c.toDataURL('image/jpeg',0.92));};
  f.src=FRAME;
};

loadRecent();
setInterval(loadRecent,15000);
</script></body></html>
