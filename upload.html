<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Golden Fiesta Camera</title>
<style>body{font-family:Arial;text-align:center;margin:20px}video,canvas,img{max-width:95%%}button{padding:12px 18px;margin:8px}</style>
</head><body>
<h2>Golden Fiesta 2026</h2>
<video id="video" autoplay playsinline></video><br>
<button id="snap">Take Photo</button>
<canvas id="canvas" style="display:none"></canvas>
<p id="status"></p>
<script>
const API_URL="PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
const FRAME="frame.png";
const v=document.getElementById('video');
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>v.srcObject=s);
document.getElementById('snap').onclick=async()=>{
 const c=document.getElementById('canvas');
 c.width=v.videoWidth;c.height=v.videoHeight;
 const x=c.getContext('2d');
 x.filter="contrast(1.08) saturate(1.06) brightness(1.05)";
 x.drawImage(v,0,0);
 const f=new Image();
 f.onload=async()=>{
   x.drawImage(f,0,0,c.width,c.height);
   const data=c.toDataURL('image/jpeg',0.92);
   document.getElementById('status').textContent="Uploading...";
   const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:data})});
   document.getElementById('status').textContent=await r.text();
 };
 f.src=FRAME;
};
</script></body></html>
