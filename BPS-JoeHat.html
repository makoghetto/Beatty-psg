<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Beatty Teachers' Day Lucky Treat</title>
<style>
:root{
  --primary:#B22222;
  --secondary:#FFD54F;
  --bg1:#fff8ef;
  --bg2:#fff0f5;
  --text:#333;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  width:min(92vw,460px);
  background:#fff;
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.12);
  position:relative;
  overflow:hidden;
}
.badge{
  display:inline-block;
  background:#fff4d6;
  color:#9a6700;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
}
h1{margin:14px 0 4px;font-size:28px}
.school{color:var(--primary);font-weight:bold}
.category{
  display:inline-block;
  margin-top:12px;
  padding:6px 14px;
  border-radius:999px;
  background:#f2f2f2;
  font-size:12px;
  font-weight:bold;
  letter-spacing:.08em;
}
.emoji{font-size:54px;margin:18px 0 10px}
.message{font-size:22px;font-weight:bold;line-height:1.35;margin:8px 0 14px}
.sub{font-size:16px;line-height:1.6;color:#555;min-height:70px}
button{
  margin-top:18px;
  border:none;
  background:var(--primary);
  color:#fff;
  padding:13px 18px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
}
button:hover{opacity:.92}
.footer{margin-top:16px;font-size:12px;color:#888}
.confetti{
  position:absolute;
  width:8px;height:14px;
  top:-20px;
  opacity:.85;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg);opacity:0}
}
.hidden{display:none}
.gameBox{margin-top:14px}
.choice{
  display:inline-block;
  margin:6px;
  padding:10px 16px;
  border-radius:12px;
  background:#f4f4f4;
  cursor:pointer;
  font-size:28px;
}
.result{margin-top:12px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <div class="badge" id="header"></div>
  <h1>🎁 Lucky Treat</h1>
  <div class="school" id="school"></div>
  <div class="category" id="category"></div>
  <div class="emoji" id="emoji"></div>
  <div class="message" id="message"></div>
  <div class="sub" id="sub"></div>

  <div id="game" class="gameBox hidden">
    <p><strong>Choose one:</strong></p>
    <div>
      <span class="choice" onclick="play('✊')">✊</span>
      <span class="choice" onclick="play('✋')">✋</span>
      <span class="choice" onclick="play('✌️')">✌️</span>
    </div>
    <div class="result" id="gameResult"></div>
  </div>

  <button onclick="showRandom()">✨ Another Treat</button>
  <div class="footer">Happy Teachers' Day • Scan again for a new surprise</div>
</div>

<script>
/* ========= EASY EDIT SECTION ========= */
const SCHOOL_NAME = "Beatty Secondary School";
const HEADER_TEXT = "Happy Teachers' Day";
const SHOW_SCHOOL = true;

const QUOTES = [
["🌱","Every lesson plants a seed.","Thank you for helping young minds grow."],
["✨","Progress, not perfection.","The little moments matter most."],
["📚","You change more lives than you realise.","Your impact goes beyond the classroom."],
["💛","A kind teacher is never forgotten.","Thank you for believing in your students."],
["🦋","Curiosity begins with someone like you.","Keep inspiring, one lesson at a time."],
["🌈","Your patience becomes someone else's confidence.","Happy Teachers' Day!"],
["☀️","Small acts. Big impact.","You make school a brighter place."],
["🎓","Education is hope in action.","Thank you for showing up every day."]
];

const WISHES = [
["🍀","Jiayou lah!","May your kopi stay hot and your students stay kind."],
["💰","Huat ah!","May today bring joy, laughter and smooth lessons."],
["☕","Chope some happiness today.","You deserve the best seat in the staff room."],
["🧋","Perfect pearl ratio!","May every bubble tea you drink be 10/10."],
["🌺","Steady bom pi pi.","May your marking pile magically shrink."],
["🌤️","Today's forecast: Appreciation.","100% chance of smiles."],
["🚌","Green lights all the way.","May every journey home be smooth."],
["🎉","Shiok day ahead!","Treat yourself—you've earned it."]
];

const FORTUNES = [
"Today someone will make you smile.",
"Good news is closer than you think.",
"Kindness you gave will come back to you.",
"Coffee tastes better after compliments.",
"Your lucky number today is " + (Math.floor(Math.random()*99)+1)
];
/* ==================================== */

const cat=document.getElementById('category');
const emoji=document.getElementById('emoji');
const msg=document.getElementById('message');
const sub=document.getElementById('sub');
const game=document.getElementById('game');

document.getElementById('header').textContent=HEADER_TEXT;
document.getElementById('school').textContent=SHOW_SCHOOL?SCHOOL_NAME:"";

function confetti(){
  for(let i=0;i<24;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'%';
    d.style.background=['#f94144','#f9c74f','#90be6d','#577590','#f3722c'][Math.floor(Math.random()*5)];
    d.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),3200);
  }
}

function randomItem(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function showRandom(){
  document.getElementById('gameResult').textContent='';
  game.classList.add('hidden');
  const roll=Math.random();
  if(roll<0.4){
    const q=randomItem(QUOTES);
    cat.textContent='INSPIRATION';
    emoji.textContent=q[0];
    msg.textContent=q[1];
    sub.textContent=q[2];
  }else if(roll<0.8){
    const w=randomItem(WISHES);
    cat.textContent='SINGAPORE WISH';
    emoji.textContent=w[0];
    msg.textContent=w[1];
    sub.textContent=w[2];
  }else{
    cat.textContent='MINI GAME';
    emoji.textContent='🎮';
    msg.textContent='Rock • Paper • Scissors';
    sub.textContent='Beat your phone to win a lucky blessing!';
    game.classList.remove('hidden');
  }
  confetti();
}

function play(user){
  const opts=['✊','✋','✌️'];
  const phone=opts[Math.floor(Math.random()*3)];
  const bless=randomItem(FORTUNES);
  let outcome='';
  if(user===phone) outcome="It's a draw 🤝";
  else if((user==='✊'&&phone==='✌️')||(user==='✋'&&phone==='✊')||(user==='✌️'&&phone==='✋')) outcome='You win! 🏆';
  else outcome='Phone wins 😄';
  document.getElementById('gameResult').innerHTML=`You: ${user} &nbsp; Phone: ${phone}<br><br>${outcome}<br>🍀 ${bless}`;
}

showRandom();
</script>
</body>
</html>
